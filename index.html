  for(var i=0;i<dish.steps.length;i++){circ(W/2-(dish.steps.length-1)*9+i*18,sa+70,5,i<si?'#ff6fa5':'#fff','#ff6fa5');}
  // едок с заказом
  var er=Math.min(30,W*.075);eater(W-er-14,sa+60+er*1.4,er,EAT[cafe?cust:S.eater].t,0,false,true);
  if(cafe){
    var bw0=W-130,pr=Math.max(0,cafe.pat/cafe.patMax);ctx.fillStyle='rgba(255,255,255,.9)';rr(16,sa+84,bw0,12,6);ctx.fill();
    ctx.fillStyle=pr>.5?'#4cc77a':pr>.25?'#f0b030':'#e04848';if(pr>0){rr(16,sa+84,Math.max(12,bw0*pr),12,6);ctx.fill();}
    ctx.strokeStyle='#f2a9c6';ctx.lineWidth=2;rr(16,sa+84,bw0,12,6);ctx.stroke();
    ctx.textAlign='left';ctx.font='bold 14px system-ui';ctx.fillStyle='#8a3a58';
    ctx.fillText('❤️'.repeat(Math.max(0,cafe.hearts))+'🖤'.repeat(3-Math.max(0,cafe.hearts)),16,sa+118);
    ctx.font='13px system-ui';ctx.fillText(T('День ')+cafe.day+T(' · клиентов ')+cafe.served+'/'+cafe.goal+(banE?T('  ·  без ')+banE:''),16,sa+138);ctx.textAlign='center';
  }
  ctx.fillStyle='#fff';rr(W-er*2-44,sa+14,46,40,12);ctx.fill();ctx.strokeStyle='#f2a9c6';ctx.lineWidth=2;ctx.stroke();emo(dish.e,W-er*2-21,sa+35,26);
  // тарелка
  var sx=shakeT>0?Math.sin(shakeT*60)*8:0;
  plate(P.cx+sx,P.cy,P.R,'#fff4f8');drawLayers(P,sx);
  if(fin)return;
  if(st.t==='pick')drawPick(st,P);
  else if(st.t==='tap')drawTap(st,P);
  else drawTimer(st,P);
}
function drawLayers(P,sx){
  for(var i=0;i<layers.length;i++){var l=layers[i];var sz=l.big?P.R*1.1:34;if(l.s>1){l.s-=.04;}var s=Math.max(1,l.s);
    emo(l.e,P.cx+sx+Math.cos(l.a)*l.r*P.R*.8,P.cy+Math.sin(l.a)*l.r*P.R*.5-(l.big?4:0),sz*s);}
}
function drawPick(st,P){
  var n=st.opts.length,bw=Math.min(92,(W-24-(n-1)*8)/n),x0=(W-(bw*n+(n-1)*8))/2,y=H-bw-34;
  ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillStyle='#8a3a58';

    var cw=ks.length*64+20,cx0=(W-cw)/2;ctx.fillStyle='#fff';rr(cx0,y-70,cw,54,14);ctx.fill();ctx.strokeStyle='#f2a9c6';ctx.lineWidth=2;ctx.stroke();
    ks.forEach(function(k,i){var left=r[k]-(got[k]||0);emo(k,cx0+10+i*64+18,y-43,28,left>0?1:.35);ctx.font='bold 17px system-ui';ctx.fillStyle=left>0?'#e0457b':'#1e9d57';ctx.textAlign='left';ctx.fillText(left>0?'×'+left:'✓',cx0+10+i*64+36,y-36);});
    ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillStyle='#8a3a58';ctx.fillText(T('Рецепт по заказу:'),W/2,y-76);}
  else ctx.fillText(T('Выбери нужное (')+cnt+'/'+st.need+')',W/2,y-12);
  for(var i=0;i<n;i++){(function(o){var x=x0+i*(bw+8);btns.push({x:x,y:y,w:bw,h:bw+10,fn:function(){pickTap(o);}});ctx.fillStyle='#fff';rr(x,y,bw,bw+10,18);ctx.fill();ctx.strokeStyle='#f2a9c6';ctx.lineWidth=3;ctx.stroke();emo(o[0],x+bw/2,y+bw*.42,Math.min(46,bw*.52));ctx.font='bold 12px system-ui';ctx.fillStyle='#8a3a58';ctx.textAlign='center';ctx.fillText(o[1],x+bw/2,y+bw+2);})(st.opts[i]);}
}
function drawTap(st,P){
  var sc=1+bounce*.25;emo(st.e,P.cx,P.cy-P.R*.15,86*sc);
  ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillStyle='#e0457b';ctx.fillText(T('Тапай! 👆'),W/2,H-98);
  var bw=Math.min(260,W-60),bx=(W-bw)/2,by=H-74;ctx.fillStyle='rgba(255,255,255,.9)';rr(bx,by,bw,22,11);ctx.fill();ctx.fillStyle='#ff6fa5';if(cnt>0){rr(bx,by,Math.max(22,bw*cnt/tapN(st)),22,11);ctx.fill();}
  ctx.strokeStyle='#f2a9c6';ctx.lineWidth=2;rr(bx,by,bw,22,11);ctx.stroke();
}
function drawTimer(st,P){
  emo(st.e,P.cx,P.cy-P.R*.15,70+Math.sin(t*6)*4);
  var bw=Math.min(300,W-48),bx=(W-bw)/2,by=H-140;
  ctx.textAlign='center';ctx.font='bold 15px system-ui';ctx.fillStyle='#8a3a58';ctx.fillText(T('Жми СТОП, когда метка в зелёном!'),W/2,by-16);
  ctx.fillStyle='#fff';rr(bx,by,bw,28,14);ctx.fill();
  ctx.fillStyle='#ffd9a0';rr(bx+bw*(.5-zo()),by,bw*zo()*2,28,14);ctx.fill();
  ctx.fillStyle='#7fd99a';rr(bx+bw*(.5-zp()),by,bw*zp()*2,28,14);ctx.fill();
  ctx.strokeStyle='#f2a9c6';ctx.lineWidth=2.5;rr(bx,by,bw,28,14);ctx.stroke();
  var mx=bx+bw*tpos;ctx.fillStyle='#e0457b';rr(mx-5,by-8,10,44,5);ctx.fill();
  btn((W-200)/2,H-90,200,60,T('✋ СТОП!'),timerStop,true,24);
}

function drawCustomerScene(sadMode,m,happy){
  bg(sadMode?'#f5e6ee':'#fff0f5',sadMode?'#e8d0c0':'#ffdcc0');var sa=satop();
  ctx.fillStyle='#f3d3b0';ctx.fillRect(0,H*.6,W,H);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(0,H*.6,W,6);
  var er=Math.min(W*.22,88),ey=sa+(H*.6-sa)*.5;eater(W/2,ey,er,EAT[cust].t,m,happy,false,sadMode);
  return {sa:sa};
}
function drawServe(){
  var k=Math.max(0,serveT/2.2);eatT+=.016;var m=serveT>.6?Math.abs(Math.sin(eatT*9)):0;
  var o=drawCustomerScene(false,m,serveT<=.6);var pcy=H*.72,R=Math.min(W*.3,112);plate(W/2,pcy,R,'#fff4f8');
  if(serveT>.6)emo(dishE||dish.e,W/2,pcy-R*.15,R*1.15*(.3+.7*Math.min(1,(serveT-.6)/1.6)));
  ctx.textAlign='center';ctx.font='bold 22px system-ui';ctx.fillStyle='#e0457b';ctx.fillText(stars===3?T('Восхитительно! 😍'):stars===2?T('Очень вкусно! 😋'):T('Вкусно! 🙂'),W/2,o.sa+40);
  ctx.font='30px system-ui';ctx.fillStyle='#f0a000';ctx.fillText('★'.repeat(stars)+'☆'.repeat(3-stars),W/2,o.sa+78);
  ctx.font='bold 15px system-ui';ctx.fillStyle='#a05575';ctx.fillText(T('Чаевые: +')+gain+' 🪙',W/2,o.sa+100);
}
function drawFail(){
  var o=drawCustomerScene(true,0,false);ctx.textAlign='center';ctx.font='bold 24px system-ui';ctx.fillStyle='#b04060';ctx.fillText(T('Клиент ушёл голодным 😢'),W/2,o.sa+44);
  ctx.font='16px system-ui';ctx.fillText(T('Потеряно сердечко: ')+'❤️'.repeat(Math.max(0,cafe.hearts))+'🖤'.repeat(3-Math.max(0,cafe.hearts)),W/2,o.sa+72);
}
function panel(title,lines,buttons){
  bg('#ffe0ec','#ffd0a8');var sa=satop();ctx.textAlign='center';ctx.fillStyle='#c2447a';ctx.font='bold 30px system-ui';ctx.fillText(title,W/2,sa+80);
  var er=Math.min(W*.2,76);eater(W/2,sa+190,er,EAT[S.eater].t,0,true);
  ctx.font='17px system-ui';ctx.fillStyle='#8a3a58';for(var i=0;i<lines.length;i++)ctx.fillText(lines[i],W/2,sa+310+i*28);
  var bw=Math.min(300,W-48),bx=(W-bw)/2,by=H-60-buttons.length*58;
  for(i=0;i<buttons.length;i++)btn(bx,by+i*58,bw,50,buttons[i][0],buttons[i][1],i===0);
}
function drawEat(done){
  bg('#fff0f5','#ffdcc0');var sa=satop();
  ctx.fillStyle='#f3d3b0';ctx.fillRect(0,H*.6,W,H);ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(0,H*.6,W,6);
  var er=Math.min(W*.22,88),ey=sa+(H*.6-sa)*.46;
  var happy=done;eater(W/2,ey,er,EAT[S.eater].t,done?0:mouth,happy,false);
  // тарелка с блюдом
  var pcy=H*.72,R=Math.min(W*.3,112);if(!done)plate(W/2,pcy,R,'#fff4f8');
  if(bites>0){var k=bites/bitesMax;emo(dishE||dish.e,W/2,pcy-R*.15,R*1.15*(.45+.55*k),1);}
  else if(!done){ctx.font='bold 20px system-ui';ctx.fillStyle='#b88';ctx.textAlign='center';ctx.fillText(T('Всё съедено! 😋'),W/2,pcy);}
  if(!done){ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle='#e0457b';ctx.fillText(T('Покорми ')+EAT[S.eater].n+'! 👆',W/2,sa+36);ctx.font='14px system-ui';ctx.fillStyle='#a05575';ctx.fillText(T('Тапай по тарелке — осталось ')+bites,W/2,sa+58);}
  else{
    var pw=Math.min(310,W-32),px=(W-pw)/2,py=sa+10;ctx.fillStyle='rgba(255,255,255,.92)';rr(px,py,pw,86,18);ctx.fill();
    ctx.textAlign='center';ctx.fillStyle='#e0457b';ctx.font='bold 22px system-ui';ctx.fillText(stars===3?T('Восхитительно! 😍'):stars===2?T('Очень вкусно! 😋'):T('Вкусно! 🙂'),W/2,py+30);
    ctx.font='30px system-ui';ctx.fillStyle='#f0a000';ctx.fillText('★'.repeat(stars)+'☆'.repeat(3-stars),W/2,py+62);
    ctx.font='bold 14px system-ui';ctx.fillStyle='#a05575';ctx.fillText('+'+gain+' 🪙'+(newStar?T('  ·  новый рекорд блюда!'):''),W/2,py+80);if(daily)ctx.fillText(T('⭐ Заказ дня: награда ×2!'),W/2,py+100);if(newReg)ctx.fillText(T('🇯🇵 Открыта новая страна: Япония!'),W/2,py+(daily?120:100));
    if(performance.now()-eatAt>500){var bw=Math.min(300,W-48),bx=(W-bw)/2,by=H-190;
      btn(bx,by,bw,50,T('🍽 Другое блюдо'),function(){state='menu';},true);btn(bx,by+58,bw,46,T('🔁 Приготовить ещё раз'),function(){startDish(dish);},false,16);btn(bx,by+112,bw,40,T('👥 Позвать друга (+15 🪙)'),share,false,15);}
  }
  if(state==='eat'){btns.push({x:0,y:H*.5,w:W,h:H*.5,fn:bite});}
}

/* ---------- цикл ---------- */
var last=0;
function update(dt){
  t+=dt;bounce=Math.max(0,bounce-dt*4);shakeT=Math.max(0,shakeT-dt);mouth=Math.max(0,mouth-dt*3);
  if(state==='cook'&&curStep().t==='timer'){tpos+=tdir*dt*tspeed();if(tpos>1){tpos=1;tdir=-1;}if(tpos<0){tpos=0;tdir=1;}}
  if(state==='cookdone'){doneT-=dt;if(doneT<=0){if(cafe)startServe();else startEat();}}
  if(cafe&&state==='cook'){cafe.pat-=dt;if(cafe.pat<=0)startFail();}
  if(state==='serve'){serveT-=dt;if(serveT<=0)afterServe();}
  if(state==='fail'){failT-=dt;if(failT<=0)afterFail();}
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1);}
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.y-=40*dt;f.l-=dt;if(f.l<=0)floats.splice(i,1);}
}
function draw(){
  btns=[];
  if(state==='menu')drawMenu();
  else if(state==='cook'||state==='cookdone'){drawCook();if(state==='cookdone'){ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillStyle='#e0457b';ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.strokeText(T('Готово! 🎉'),W/2,satop()+(H-satop())*.17);ctx.fillText(T('Готово! 🎉'),W/2,satop()+(H-satop())*.17);}}
  else if(state==='serve')drawServe();
  else if(state==='fail')drawFail();
  else if(state==='dayend')panel(T('День ')+cafe.day+T(' пройден! 🎉'),[T('Клиентов за игру: ')+cafe.total,T('Бонус за день: +')+cafe.bonus+' 🪙',T('Завтра будет труднее!')],[[T('▶ Следующий день'),nextDay],[T('🏠 В меню'),menuBack],[T('👥 Позвать друга (+15 🪙)'),share]]);
  else if(state==='cafeover')panel(T('Кафе закрыто 😢'),[T('Клиентов обслужено: ')+cafe.total,T('Дней пройдено: ')+(cafe.day-1),T('Рекорд: ')+S.cafeBest],[[T('🔁 Ещё раз'),startCafe],[T('🏆 Рейтинг'),LB.open],[T('🏠 В меню'),menuBack]]);
  else drawEat(state==='eatdone');
  for(var i=0;i<parts.length;i++){var p=parts[i];emo(p.e,p.x,p.y,22,Math.min(1,p.l*2));}
  for(i=0;i<floats.length;i++){var f=floats[i];ctx.globalAlpha=Math.min(1,f.l*1.5);ctx.textAlign='center';ctx.font='bold 20px system-ui';ctx.fillStyle=f.c;ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeText(f.s,f.x,f.y);ctx.fillText(f.s,f.x,f.y);ctx.globalAlpha=1;}
  if(performance.now()<msgT){ctx.fillStyle='rgba(60,20,40,.85)';rr(W/2-140,H-120,280,38,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.textAlign='center';ctx.fillText(msg,W/2,H-95);}
}
function loop(ts){var dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}

/* ---------- ввод ---------- */
function hitBtn(x,y){for(var i=btns.length-1;i>=0;i--){var b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b;}return null;}
var tapDone=false;
cv.addEventListener('pointerdown',function(e){initAudio();tapDone=false;dragY=e.clientY;dragS=menuScroll;dragged=false;
  if(state==='cook'&&curStep().t==='tap'&&!hitBtn(e.clientX,e.clientY)){tapStep();tapDone=true;}
  else if(state==='eat'){bite();tapDone=true;}
});
cv.addEventListener('pointermove',function(e){if(dragY!==null&&state==='menu'){var dy=e.clientY-dragY;if(Math.abs(dy)>8)dragged=true;if(dragged)menuScroll=dragS-dy;}});
cv.addEventListener('pointerup',function(){dragY=null;});cv.addEventListener('pointercancel',function(){dragY=null;});
cv.addEventListener('click',function(e){
  if(tapDone){tapDone=false;return;}
  if(dragged){dragged=false;return;}
  var b=hitBtn(e.clientX,e.clientY);if(b&&b.fn!==bite)b.fn();
});
requestAnimationFrame(loop);
window.__dbg={startCafe:startCafe,nextDay:nextDay,get cafe(){return cafe;},get recipe(){return recipe;},get banE(){return banE;},startDish:startDish,DISH:DISH,pickTap:pickTap,tapStep:tapStep,timerStop:timerStop,bite:bite,get state(){return state;},get si(){return si;},get dish(){return dish;},cur:curStep,S:S};
})();
